architectures:
  standard_3_layer:
    encoder_channels: [16, 32, 64]
    decoder_channels: [32, 16]
    kernel_size: 3
    stride: 1
    multiplier: 22

  deep_4_layer:
    encoder_channels: [16, 32, 64, 128]
    decoder_channels: [64, 32, 16]
    kernel_size: 3
    stride: 1
    multiplier: 20

hyperparameter_grid:
  - arch_name: "standard_3_layer"
    latent_dims: [15, 18, 21, 24]
    kl_weights: [0.01, 0.05, 0.1, 0.2]

  - arch_name: "deep_4_layer"
    latent_dims: [18, 21]
    kl_weights: [0.01, 0.05, 0.1, 0.2]

output:
  checkpoint: checkpoints
  log: logs